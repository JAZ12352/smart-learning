#mybatis page helper
pagehelper:
  autoDialect: true
  closeConn: true
  reasonable: true


#mybatis datasource default HikariPool
spring:
  datasource:
    hikari:
      idle-timeout: 600000  #10 min
      max-lifetime: 1800000 #30 min


  #runningtime environment
  profiles:
    active:  dev

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  temperature: ${DEEPSEEK_TEMPERATURE:0.7}

# Python 多智能体服务配置
python:
  service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8100}
    enabled: true