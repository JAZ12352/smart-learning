# ===========================================
# 单元测试配置 — H2 内嵌数据库
# ===========================================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
    schema: classpath:db/schema-h2.sql

logging:
  level:
    com.mindskip: DEBUG
