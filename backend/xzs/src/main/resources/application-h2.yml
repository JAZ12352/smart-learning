# ===========================================
# H2 内嵌数据库配置（MySQL 兼容模式）
# 使用方式: java -jar xzs-3.9.0.jar --spring.profiles.active=h2
#
# 无需安装 MySQL，开箱即用！
# 数据持久化到 ./data/h2db 目录
# H2 Console: http://localhost:8001/h2-console
# ===========================================
logging:
  path: ./log/

spring:
  datasource:
    url: jdbc:h2:file:./data/h2db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
    schema: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
